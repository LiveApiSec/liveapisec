# liveapisec — official CLI/SDK for the LiveAPISec Developer API (TODO 2.25).
# Install from PyPI:  pip install liveapisec
# Or from GitHub:     pip install git+https://github.com/LiveApiSec/liveapisec.git
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liveapisec"
version = "0.1.11"
description = "LiveAPISec Developer API client — push API specs, run security scans and gate your CI/CD from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LiveAPISec" }]
keywords = ["security", "api", "dast", "scanning", "ci", "cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
liveapisec = "liveapisec.cli:main"

[project.urls]
Homepage = "https://liveapisec.com"
Documentation = "https://liveapisec.com/settings"

[tool.setuptools.packages.find]
include = ["liveapisec*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

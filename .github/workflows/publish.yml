name: publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # do Trusted Publishing (fallback, gdy brak PYPI_API_TOKEN)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      # Publikacja na PyPI:
      #  1) token API z PyPI jako sekret PYPI_API_TOKEN (username: __token__),
      #  2) fallback: Trusted Publishing (OIDC, bez sekretów).
      # Uwaga: secrets nie jest dostępny w warunkach `if` — stąd env.
      - name: Publish to PyPI (API token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to PyPI (Trusted Publishing)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
